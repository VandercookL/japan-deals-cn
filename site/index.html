<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="在日好价，整理日本线上线下折扣、优惠券及促销活动，方便在日华人查看。"><title>在日好价｜日本线上线下优惠信息</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;color:#18212d;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#142b48;color:white;padding:22px max(18px,calc((100vw - 1120px)/2))}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;color:#d0dcea}main{max-width:1120px;margin:auto;padding:26px 18px}.hero{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 14px #172b4d0a}.hero h2{margin:0 0 8px}.muted{color:#667488}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filters input,.filters select{padding:12px;border:1px solid #d5dce4;border-radius:10px;background:white;font-size:15px}.filters input{flex:2;min-width:180px}.filters select{flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.deal{background:white;border:1px solid #e6ebf0;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}.deal h3{margin:0;font-size:17px}.tag{display:inline-block;background:#e8f1fc;color:#1e4c87;padding:5px 9px;border-radius:8px;font-size:12px;width:max-content}.price{font-size:25px;font-weight:750}.old{color:#89929e;text-decoration:line-through}.btn{display:inline-block;text-align:center;text-decoration:none;color:white;background:#1264a3;border-radius:9px;padding:11px;font-weight:650;margin-top:auto}.btn:hover{background:#084a80}.note{font-size:12px;color:#677589}.empty{background:white;padding:32px;border-radius:14px;text-align:center}footer{max-width:1120px;margin:30px auto;padding:15px 18px;color:#687482;font-size:13px}a{color:#1264a3}footer a{margin-right:15px}@media(max-width:600px){header h1{font-size:22px}}

header{background:#fff;color:#172b28;border-bottom:1px solid #e6e9e6;padding-top:26px;padding-bottom:24px}
header h1{font-size:29px;font-weight:800;letter-spacing:-.8px}
header p{color:#63716a;font-size:14px}
body{background:#f7f8f5;color:#202923}
main{padding-top:28px}
.hero{box-shadow:none;border:1px solid #e6eae5;border-radius:12px;padding:22px 24px}
.hero h2{font-size:21px}
.hero .muted{font-size:14px;line-height:1.65;margin:0 0 14px}
.filters{margin:16px 0}
.filters input,.filters select{border:1px solid #dce2dc;border-radius:8px;outline-color:#246b51}
.deal{border-color:#e3e8e1;border-radius:10px;box-shadow:0 2px 8px #19291b08}

.price{color:#1b5d3b}

</style></head><body><header><h1>在日好价</h1><p>日本线上线下优惠、折扣和促销活动</p></header><main><section class="hero"><h2>最新优惠</h2><p class="muted">汇总日本电商和实体店的近期优惠，价格及活动条件以商家公布的信息为准。</p><p id="updated" class="note">正在读取数据…</p></section><div class="filters"><input id="q" placeholder="搜索商品、商家或活动" aria-label="搜索"><select id="category" aria-label="分类"><option value="">全部分类</option></select><select id="sort" aria-label="排序"><option value="new">最近更新</option><option value="price">价格从低到高</option></select></div><section id="deals" class="grid" aria-live="polite"></section></main><footer><p>部分链接可能为推广链接，购买后本站可能获得佣金。</p><p>价格、库存及活动规则请以商家页面为准。</p><a href="https://www.rakuten.co.jp/" rel="noopener">楽天</a><a href="https://www.amazon.co.jp/" rel="noopener">Amazon Japan</a><p></p></footer><script>
let all=[];const $=id=>document.getElementById(id);const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');function safeUrl(u){try{let v=new URL(u);return v.protocol==='https:'?v.href:'#'}catch{return '#'}}function render(){let q=$('q').value.toLowerCase().trim(),cat=$('category').value;let items=all.filter(x=>(!cat||x.category===cat)&&[x.title,x.merchant,x.description].join(' ').toLowerCase().includes(q));if($('sort').value==='price')items.sort((a,b)=>a.price_jpy-b.price_jpy);else items.sort((a,b)=>String(b.verified_at).localeCompare(String(a.verified_at)));$('deals').replaceChildren();if(!items.length){let e=document.createElement('div');e.className='empty';e.textContent='暂无优惠信息';$('deals').append(e);return}for(let x of items){let c=document.createElement('article');c.className='deal';let tag=document.createElement('span');tag.className='tag';tag.textContent=x.category+' · '+x.merchant;c.append(tag);let h=document.createElement('h3');h.textContent=x.title;c.append(h);let d=document.createElement('p');d.className='muted';d.textContent=x.description||'';c.append(d);let p=document.createElement('div');p.className='price';p.textContent=yen(x.price_jpy);c.append(p);if(x.reference_price_jpy && x.reference_price_evidence_url){let old=document.createElement('div');old.className='old';old.textContent='参考价 '+yen(x.reference_price_jpy);c.append(old)}let note=document.createElement('div');note.className='note';note.textContent='更新：'+x.verified_at+' · 来源：'+x.source_type;c.append(note);let a=document.createElement('a');a.className='btn';a.href=safeUrl(x.affiliate_url||x.url);a.target='_blank';a.rel='sponsored nofollow noopener noreferrer';a.textContent='查看优惠';c.append(a);$('deals').append(c)}}async function load(){try{let r=await fetch('./deals.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();all=(d.deals||[]).filter(x=>x.verified===true&&x.price_jpy>0&&x.url&&(!x.expires_at||Date.parse(x.expires_at)>Date.now()));$('updated').textContent='更新于 '+(d.generated_at?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(d.generated_at)):'暂无')+' · '+all.length+' 条';for(let v of [...new Set(all.map(x=>x.category))].sort()){let o=document.createElement('option');o.value=v;o.textContent=v;$('category').append(o)}render()}catch(e){$('updated').textContent='数据暂不可用';$('deals').textContent='读取失败，请稍后刷新。'}}['q','category','sort'].forEach(x=>$(x).addEventListener(x==='q'?'input':'change',render));load();
</script></body></html>
