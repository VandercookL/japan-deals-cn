    /* =====================================================
       Base
       ===================================================== */

    :root {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Noto Sans JP",
        sans-serif;

      color: #202923;
      background: #f7f8f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8f5;
      color: #202923;
    }

    a {
      color: inherit;
    }


    /* =====================================================
       Header
       ===================================================== */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e9e5;
    }

    .header-inner {
      max-width: 1120px;
      margin: auto;
      padding: 27px 18px 25px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .brand-area {
      min-width: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #216d4c;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      font-size: 18px;
      font-weight: 800;
    }

    header h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.2;
      letter-spacing: -0.8px;
      font-weight: 800;
    }

    .header-subtitle {
      margin: 8px 0 0;
      color: #68756d;
      font-size: 14px;
    }


    /* =====================================================
       Language switcher
       ===================================================== */

    .language-switcher {
      display: flex;
      align-items: center;
      gap: 3px;

      flex-shrink: 0;

      background: #f6f8f6;
      border: 1px solid #e2e7e2;
      border-radius: 8px;

      padding: 3px;
    }

    .language-button {
      appearance: none;
      border: 0;
      background: transparent;

      color: #6a756d;

      border-radius: 6px;

      padding: 7px 9px;

      font-size: 12px;
      font-family: inherit;

      cursor: pointer;

      transition:
        background .15s,
        color .15s;
    }

    .language-button:hover {
      color: #285d43;
    }

    .language-button.active {
      background: #ffffff;
      color: #1d6241;
      font-weight: 650;

      box-shadow:
        0 1px 3px rgba(30, 50, 37, .08);
    }


    /* =====================================================
       Main
       ===================================================== */

    main {
      max-width: 1120px;
      margin: auto;
      padding: 30px 18px 10px;
    }


    /* =====================================================
       Intro
       ===================================================== */

    .hero {
      background: #ffffff;
      border: 1px solid #e4e9e4;
      border-radius: 12px;
      padding: 23px 25px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .hero-description {
      margin: 0;
      color: #657168;
      font-size: 14px;
      line-height: 1.7;
      max-width: 760px;
    }

    .update-info {
      white-space: nowrap;
      font-size: 12px;
      color: #7a867d;
      margin-top: 4px;
    }


    /* =====================================================
       Deal type tabs
       ===================================================== */

    .type-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .type-tab {
      border: 1px solid #dce3dd;
      background: #ffffff;
      color: #536158;

      padding: 8px 13px;
      border-radius: 7px;

      font-family: inherit;
      font-size: 13px;
      cursor: pointer;

      transition:
        background .15s,
        border-color .15s,
        color .15s;
    }

    .type-tab:hover {
      border-color: #9ab3a2;
    }

    .type-tab.active {
      background: #e8f2eb;
      color: #216343;
      border-color: #bfd5c6;
      font-weight: 650;
    }


    /* =====================================================
       Search / filters
       ===================================================== */

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 2fr) 1fr 1fr;
      gap: 10px;
      margin: 18px 0 22px;
    }

    .filters input,
    .filters select {
      width: 100%;

      background: #ffffff;
      border: 1px solid #dce2dc;
      border-radius: 8px;

      padding: 12px 13px;

      color: #28312b;

      font-family: inherit;
      font-size: 14px;

      outline: none;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: #609278;
      box-shadow:
        0 0 0 3px rgba(33, 109, 76, .08);
    }


    /* =====================================================
       Deal grid
       ===================================================== */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(280px, 1fr)
        );

      gap: 16px;
    }


    /* =====================================================
       Deal card
       ===================================================== */

    .deal {
      background: #ffffff;
      border: 1px solid #e2e7e2;
      border-radius: 11px;

      padding: 18px;

      display: flex;
      flex-direction: column;
      gap: 11px;

      min-height: 270px;

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
    }

    .deal:hover {
      transform: translateY(-2px);
      border-color: #d4ddd5;

      box-shadow:
        0 7px 20px
        rgba(31, 49, 37, .07);
    }

    .deal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;

      background: #e8f2eb;
      color: #286444;

      border-radius: 5px;

      padding: 5px 8px;

      font-size: 12px;
      line-height: 1;
    }

    .merchant-tag {
      background: #f1f3f1;
      color: #667168;
    }

    .deal h3 {
      margin: 0;

      font-size: 17px;
      line-height: 1.5;

      letter-spacing: -.15px;
    }

    .description {
      color: #66736a;

      font-size: 13px;
      line-height: 1.65;

      margin: 0;
    }


    /* =====================================================
       Price
       ===================================================== */

    .price-area {
      margin-top: 2px;
    }

    .price {
      color: #1b5d3b;

      font-size: 26px;
      line-height: 1.2;

      font-weight: 760;
      letter-spacing: -.5px;
    }

    .offer-text {
      color: #1b5d3b;

      font-size: 19px;
      line-height: 1.4;

      font-weight: 700;
    }

    .old {
      margin-top: 5px;

      color: #8b958e;

      font-size: 12px;
    }

    .old-price {
      text-decoration: line-through;
    }


    /* =====================================================
       Meta
       ===================================================== */

    .note {
      color: #78847b;

      font-size: 12px;
      line-height: 1.6;
    }


    /* =====================================================
       Button
       ===================================================== */

    .btn {
      display: block;

      margin-top: auto;
      padding: 11px 14px;

      background: #216d4c;
      color: #ffffff;

      border-radius: 7px;

      text-align: center;
      text-decoration: none;

      font-size: 14px;
      font-weight: 650;

      transition: background .15s;
    }

    .btn:hover {

    }


    /* =====================================================
       Empty state
       ===================================================== */

    .empty {
      grid-column: 1 / -1;

      background: #ffffff;
      border: 1px dashed #d5ded6;
      border-radius: 11px;

      padding: 65px 20px;

      }

      .deal {

      .header-top {
        display: block;
      }

      .language-switcher {
        width: max-content;
        margin-top: 16px;
      }

    }

    /* =====================================================
       State
       ===================================================== */

    let all = [];

    let selectedType = "";

    let generatedAt = null;


    const $ = id =>
      document.getElementById(id);


    /* =====================================================
       Language
       ===================================================== */

    function detectInitialLanguage() {

      const saved =
        localStorage.getItem(
          "siteLanguage"
        );


      if (
        saved &&
        translations[saved]
      ) {
        return saved;
      }


      const browserLanguage =
        (
          navigator.language
          || ""
        ).toLowerCase();


      if (
        browserLanguage.startsWith(
          "zh"
        )
      ) {
        return "zh";
      }


      if (
        browserLanguage.startsWith(
          "ja"
        )
      ) {
        return "ja";
      }


      return "en";

    }


    let currentLanguage =
      detectInitialLanguage();


    function t(key) {

      return (
        translations[
          currentLanguage
        ][key]
        ?? key
      );

    }


    function translateDealType(
      type
    ) {

      const map = {

        "商品降价":
          t("priceDrop"),

        "优惠券与积分":
          t("coupon"),

        "线下促销":
          t("offline")

      };


      return map[type] || type;

    }


    function setLanguage(
      language
    ) {

      if (
        !translations[language]
      ) {
        return;
      }


      currentLanguage =
        language;


      localStorage.setItem(
        "siteLanguage",
        language
      );


      document.documentElement.lang =
        t("htmlLang");


      document.title =
        t("pageTitle");


      $("metaDescription").content =
        t("metaDescription");


      $("headerSubtitle").textContent =
        t("headerSubtitle");


      $("heroTitle").textContent =
        t("heroTitle");


      $("heroDescription").textContent =
        t("heroDescription");


      /* Deal type buttons */

      const typeButtons =
        document.querySelectorAll(
          ".type-tab"
        );


      typeButtons[0].textContent =
        t("all");

      typeButtons[1].textContent =
        t("priceDrop");

      typeButtons[2].textContent =
        t("coupon");

      typeButtons[3].textContent =
        t("offline");


      /* Search */

      $("q").placeholder =
        t("searchPlaceholder");

      $("q").setAttribute(
        "aria-label",
        t("searchLabel")
      );


      /* Category */

      $("category")
        .setAttribute(
          "aria-label",
          t("categoryLabel")
        );


      $("category")
        .options[0]
        .textContent =
          t("allCategories");


      /* Sort */

      $("sort").setAttribute(
        "aria-label",
        t("sortLabel")
      );


      $("sort")
        .querySelector(
          'option[value="new"]'
        )
        .textContent =
          t("newest");


      $("sort")
        .querySelector(
          'option[value="price"]'
        )
        .textContent =
          t("priceLow");


      /* Footer */

      $("footer1").textContent =
        t("footer1");

      $("footer2").textContent =
        t("footer2");

      $("footer3").textContent =
        t("footer3");


      /* Language buttons */

      document
        .querySelectorAll(
          ".language-button"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.lang
              === currentLanguage
            );

          }
        );


      updateStatus();


      render();

    }


    /* =====================================================
       Formatting
       ===================================================== */

    const yen = number =>
      "¥"
      +
      Number(number)
        .toLocaleString(
          "ja-JP"
        );


    function safeUrl(url) {

      try {

        const parsed =
          new URL(url);


        return (
          parsed.protocol === "https:"
            ? parsed.href
            : "#"
        );

      } catch {

        return "#";

      }

    }


    function formatDate(value) {

      if (!value) {
        return "";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }


      return new Intl.DateTimeFormat(
        t("locale"),
        {
          timeZone:
            "Asia/Tokyo",

          month:
            "numeric",

          day:
            "numeric"
        }
      ).format(date);

    }


    function formatDateTime(value) {

      if (!value) {
        return t("noDate");
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return t("noDate");
      }


      return new Intl.DateTimeFormat(
        t("locale"),
        {
          timeZone:
            "Asia/Tokyo",

          month:
            "numeric",

          day:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit"
        }
      ).format(date);

    }


    function updateStatus() {

      if (!generatedAt) {

        $("updated").textContent =
          t("loading");

        return;

      }


      $("updated").textContent =
        t("updated")
        + " "
        + formatDateTime(
            generatedAt
          )
        + " · "
        + all.length
        + " "
        + t("itemUnit");

    }


    /* =====================================================
       Render
       ===================================================== */

    function render() {

      const query =
        $("q")
          .value
          .toLowerCase()
          .trim();


      const category =
        $("category").value;


      let items =
        all.filter(
          item => {


            if (
              selectedType &&
              item.deal_type
              !== selectedType
            ) {
              return false;
            }


            if (
              category &&
              item.category
              !== category
            ) {
              return false;
            }


            const searchText = [

              item.title,
              item.merchant,
              item.description,
              item.location,
              item.deal_type,
              item.offer_text,
              item.category,
              translateDealType(
                item.deal_type
              )

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return searchText.includes(
              query
            );

          }
        );


      /* Sorting */

      if (
        $("sort").value
        === "price"
      ) {

        items.sort(
          (a, b) =>
            (
              a.price_jpy
              ?? Infinity
            )
            -
            (
              b.price_jpy
              ?? Infinity
            )
        );

      } else {

        items.sort(
          (a, b) =>
            String(
              b.verified_at
              || ""
            )
              .localeCompare(
                String(
                  a.verified_at
                  || ""
                )
              )
        );

      }


      const container =
        $("deals");


      container.replaceChildren();


      /* =================================================
         Empty state
         ================================================= */

      if (!items.length) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty";


        const title =
          document.createElement(
            "p"
          );


        title.className =
          "empty-title";


        const description =
          document.createElement(
            "p"
          );


        description.className =
          "empty-description";


        if (
          all.length === 0
        ) {

          title.textContent =
            t("noVerified");

          description.textContent =
            t("monitoring");

        } else {

          title.textContent =
            t("noResults");

          description.textContent =
            t("changeSearch");

        }


        empty.append(
          title,
          description
        );


        container.append(
          empty
        );


        return;

      }


      /* =================================================
         Deal cards
         ================================================= */

      for (
        const item
        of items
      ) {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "deal";


        /* Tags */

        const tags =
          document.createElement(
            "div"
          );


        tags.className =
          "deal-tags";


        if (
          item.deal_type
        ) {

          const dealTag =
            document.createElement(
              "span"
            );


          dealTag.className =
            "tag";


          dealTag.textContent =
            translateDealType(
              item.deal_type
            );


          tags.append(
            dealTag
          );

        }


        if (
          item.merchant
        ) {

          const merchantTag =
            document.createElement(
              "span"
            );


          merchantTag.className =
            "tag merchant-tag";


          merchantTag.textContent =
            item.merchant;


          tags.append(
            merchantTag
          );

        }


        card.append(
          tags
        );


        /* Title */

        const title =
          document.createElement(
            "h3"
          );


        title.textContent =
          item.title
          || t("genericDeal");


        card.append(
          title
        );


        /* Description */

        if (
          item.description
        ) {

          const description =
            document.createElement(
              "p"
            );


          description.className =
            "description";


          description.textContent =
            item.description;


          card.append(
            description
          );

        }


        /* Price */

        const priceArea =
          document.createElement(
            "div"
          );


        priceArea.className =
          "price-area";


        const price =
          document.createElement(
            "div"
          );


        if (
          item.price_jpy
        ) {

          price.className =
            "price";


          price.textContent =
            yen(
              item.price_jpy
            );

        } else {

          price.className =
            "offer-text";


          price.textContent =
            item.offer_text
            || t("viewDetails");

        }


        priceArea.append(
          price
        );


        /* Reference price */

        if (
          item.reference_price_jpy
          &&
          item.reference_price_evidence_url
        ) {

          const old =
            document.createElement(
              "div"
            );


          old.className =
            "old";


          const oldLabel =
            document.createTextNode(
              t("referencePrice")
              + " "
            );


          const oldPrice =
            document.createElement(
              "span"
            );


          oldPrice.className =
            "old-price";


          oldPrice.textContent =
            yen(
              item.reference_price_jpy
            );


          old.append(
            oldLabel,
            oldPrice
          );


          priceArea.append(
            old
          );

        }


        card.append(
          priceArea
        );


        /* Metadata */

        const metadata = [];


        metadata.push(
          item.location
          || t("online")
        );


        if (
          item.expires_at
        ) {

          metadata.push(
            t("expires")
            + " "
            + formatDate(
                item.expires_at
              )
          );

        }


        if (
          item.verified_at
        ) {

          metadata.push(
            t("verified")
            + " "
            + formatDate(
                item.verified_at
              )
          );

        }


        const note =
          document.createElement(
            "div"
          );


        note.className =
          "note";


        note.textContent =
          metadata.join(
            " · "
          );


        card.append(
          note
        );


        /* Button */

        const link =
          document.createElement(
            "a"
          );


        link.className =
          "btn";


        link.href =
          safeUrl(
            item.affiliate_url
            || item.url
          );


        link.target =
          "_blank";


        if (
          item.affiliate_url
        ) {

          link.rel =
            "sponsored nofollow noopener noreferrer";

        } else {

          link.rel =
            "noopener noreferrer";

        }


        link.textContent =
          t("viewDeal");


        card.append(
          link
        );


        container.append(
          card
        );

      }

    }


    /* =====================================================
       Load deals.json
       ===================================================== */

    async function load() {

      $("updated").textContent =
        t("loading");


      try {

        const response =
          await fetch(
            "./deals.json",
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP "
            + response.status
          );

        }


        const data =
          await response.json();


        generatedAt =
          data.generated_at
          || null;


        all =
          (
            data.deals
            || []
          ).filter(
            item =>
              item.verified
              === true

              &&

              (
                item.price_jpy
                == null

                ||

                item.price_jpy
                > 0
              )

              &&

              item.url

              &&

              (
                !item.expires_at

                ||

                Date.parse(
                  item.expires_at
                )
                >
                Date.now()
              )
          );


        /* Categories */

        const categorySelect =
          $("category");


        while (
          categorySelect.options.length
          > 1
        ) {

          categorySelect.remove(
            1
          );

        }


        const categories = [
          ...new Set(
            all
              .map(
                item =>
                  item.category
              )
              .filter(Boolean)
          )
        ].sort();


        for (
          const category
          of categories
        ) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            category;


          option.textContent =
            category;


          categorySelect.append(
            option
          );

        }


        updateStatus();

        render();

      } catch (
        error
      ) {

        console.error(
          error
        );


        $("updated").textContent =
          t("unavailable");


        $("deals")
          .replaceChildren();


        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty";


        const title =
          document.createElement(
            "p"
          );


        title.className =
          "empty-title";


        title.textContent =
          t("loadFailed");


        const description =
          document.createElement(
            "p"
          );


        description.className =
          "empty-description";


        description.textContent =
          t("retry");


        empty.append(
          title,
          description
        );


        $("deals").append(
          empty
        );

      }

    }


    /* =====================================================
       Events
       ===================================================== */

    $("q").addEventListener(
      "input",
      render
    );


    $("category")
      .addEventListener(
        "change",
        render
      );


    $("sort")
      .addEventListener(
        "change",
        render
      );


    document
      .querySelectorAll(
        ".type-tab"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              selectedType =
                button.dataset.type
                || "";


              document
                .querySelectorAll(
                  ".type-tab"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              render();

            }
          );

        }
      );


    document
      .querySelectorAll(
        ".language-button"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              setLanguage(
                button.dataset.lang
              );

            }
          );

        }
      );


    /* =====================================================
       Start
       ===================================================== */

    setLanguage(
      currentLanguage
    );


    load();

  </script>

</body>
</html>
